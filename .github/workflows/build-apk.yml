name: Build Vector Assistant APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Fix Line Endings and Permissions
      run: |
        sed -i 's/\r$//' gradlew
        chmod +x gradlew

    - name: Build Debug APK
      run: |
        ./gradlew :app:assembleDebug --stacktrace --no-daemon

    - name: List Generated APK
      run: |
        ls -la app/build/outputs/apk/debug/

    - name: Upload Debug APK Artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: VectorAssistant-Debug-APK
        path: app/build/outputs/apk/debug/*.apk

    - name: Create or Update GitHub Release
      if: success()
      uses: softprops/action-gh-release@v2
      with:
        tag_name: latest-apk
        name: "Vector Assistant Latest APK"
        body: |
          ### 🚀 Vector Assistant APK (Ready to Install)
          Download the `app-debug.apk` file below and install it directly on your Android phone.
        files: app/build/outputs/apk/debug/*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
