name: Build Vector Assistant APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Fix Line Endings and Permissions
      run: |
        sed -i 's/\r$//' gradlew
        chmod +x gradlew

    - name: Build Debug APK
      run: |
        ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee build.log

    - name: Upload Debug APK Artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: VectorAssistant-Debug-APK
        path: app/build/outputs/apk/debug/*.apk

    - name: Create or Update GitHub Release
      if: success()
      uses: softprops/action-gh-release@v2
      with:
        tag_name: latest-apk
        name: "Vector Assistant Latest APK"
        body: |
          ### 🚀 Vector Assistant APK (Ready to Install)
          - **Voice Biometrics:** Sirf aapki awaz recognize karega ("Hey Vector" / "Suno Vector").
          - **Screen-Off Active:** Phone lock hone par bhi background listening active rehti hai.
          - **Gemini Pro AI:** Natural conversations, topic analysis, aur automated attractive WhatsApp campaigns.
          - **Phone Controls:** Calls, Contacts Save, Call History, VIP Alerts, YouTube, Flashlight, Volume.
          
          Directly download the `.apk` file below and install it on your Android 13 device.
        files: app/build/outputs/apk/debug/*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
